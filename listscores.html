<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Memory Game High Scores</title>
        <meta name="description" content="Memory Game">
        <meta name="author" content="Rolando Vincoy and James Wright">
        <link rel="stylesheet" href="memory.css">
        <link rel="icon" type="image/png" href="cards/favicon.png" sizes="92x92" />
        <meta property="og:title" content="Memory Game">
        <meta property="og:description" content="This is a memory game website.">
        <meta property="og:image" content="https://rvincoy.github.io/wdd231grp/cards/favicon.png">
        <meta property="og:url" content="https://rvincoy.github.io/wdd231grp/">
        <meta property="og:type" content="website">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
<body>
    <h1 style="display:flex; background-color: #312F2F; color: white;height: 70px; justify-content: center; align-items: center; margin-bottom: 40px;">Memory Game High Scores</h1>
    <table id="scoreTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <p id="message"></p>
    <script>
const params = new URLSearchParams(window.location.search);
const message = document.getElementById("message");

if (params.get("score")) {
  message.textContent =
    "Current Score is " +
    params.get("score") +
    " by " +
    localStorage.getItem("playerName");
}

async function loadScores() {
  let scores = [];
  const stored = localStorage.getItem("memoryTop10");

  if (stored) {
    scores = JSON.parse(stored);
  } else {
    try {
      const response = await fetch("scores.json");
      scores = await response.json();
      localStorage.setItem("memoryTop10", JSON.stringify(scores));
    } catch (error) {
      console.error("Error loading scores:", error);
      return;
    }
  }

  // Sort ascending (lowest moves first)
  scores.sort((a, b) => a.score - b.score);

  const tbody = document.querySelector("#scoreTable tbody");
  tbody.innerHTML = "";

  let x = 0;

  scores.forEach((entry) => {
    const row = document.createElement("tr");

    if (x < 1) {
      row.innerHTML = `
        <td class="row1">${entry.name}</td>
        <td class="row1">${entry.score}</td>
      `;
      x = 1;
    } else {
      row.innerHTML = `
        <td class="row2">${entry.name}</td>
        <td class="row2">${entry.score}</td>
      `;
      x = 0;
    }

    tbody.appendChild(row);
  });
}

loadScores();
</script>
</body>
<footer>
    <nav>
        <a href="index.html">Back to Home Page</a>
    </nav>
</footer>
</html>
