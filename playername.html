
<!DOCTYPE html>
<html lang="en-us">
	<head>
        <meta charset="UTF-8">
        <title>Enter Player Name</title>
        <meta name="description" content="Memory Game">
        <meta name="author" content="Rolando Vincoy and James Wright">
        <link rel="stylesheet" href="memory.css">
        <link rel="icon" type="image/png" href="cards/favicon.png" sizes="92x92" />
        <meta property="og:title" content="Memory Game">
        <meta property="og:description" content="This is a memory game website.">
        <meta property="og:image" content="https://rvincoy.github.io/wdd231grp/cards/favicon.png">
        <meta property="og:url" content="https://rvincoy.github.io/wdd231grp/">
        <meta property="og:type" content="website">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
	</head>

	<body>

		<header>
			<h1>Enter Player Name</h1>
		</header>

		<main>
			<p></p>
			<form id="nameForm">
			<label for="playerNameInput">Player Name:</label>
			<input type="text" id="playerNameInput" required>
			<button type="submit">Save Name</button>
			</form>
			<p id="message"></p>

			<nav>
				<a href="index.html">Back to the Home Page</a>
			</nav>
			
		</main>

		<script>
		const form = document.getElementById("nameForm");
		const message = document.getElementById("message");

		// Autofill if name already exists
		const existingName = localStorage.getItem("playerName");
		if (existingName) {
			document.getElementById("playerNameInput").value = existingName;
		}

		form.addEventListener("submit", function(event) {
			event.preventDefault();

			const playerName = document.getElementById("playerNameInput").value;

			localStorage.setItem("playerName", playerName);

			message.textContent = `Player name "${playerName}" has been successfully stored!`;
		});
		</script>

	</body>
</html>
